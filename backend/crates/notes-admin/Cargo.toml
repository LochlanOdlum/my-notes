[package]
name = "notes-admin"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
lambda_http = "0.14"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing-subscriber = { version = "0.3", features = ["json"] }
tower = { version = "0.5", features = ["util"] }

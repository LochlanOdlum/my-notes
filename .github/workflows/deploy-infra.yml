name: Validate and deploy infrastructure

on:
  pull_request:
    paths:
      - 'infra/**'
      - 'backend/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-infra.yml'
  push:
    branches:
      - main
    paths:
      - 'infra/**'
      - 'backend/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-infra.yml'
  workflow_dispatch:

concurrency:
  group: deploy-infrastructure
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build the CDK application
        run: npm run build --workspace infra

      - name: Test the CDK application
        run: npm run test --workspace infra

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment: aws-production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate deployment configuration
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          test -n "$AWS_REGION" || { echo 'AWS_REGION is not set on aws-production.'; exit 1; }
          test -n "$AWS_ACCOUNT_ID" || { echo 'AWS_ACCOUNT_ID is not set on aws-production.'; exit 1; }
          test -n "$AWS_DEPLOY_ROLE_ARN" || { echo 'AWS_DEPLOY_ROLE_ARN is not set on aws-production.'; exit 1; }

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.2
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: my-notes-infra-deploy
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}

      - name: Deploy CDK stacks
        run: npm run cdk -- deploy --require-approval never
